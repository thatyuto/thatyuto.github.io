<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Yuto Wong</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}Yuto Wong">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/photo.jpg' | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0b0c'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='28' font-weight='700' fill='white'>YW</text></svg>">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="mark">YW</span><span class="name-text">Yuto Wong</span></a>
    <nav>
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
      <a href="{{ '/writing/' | relative_url }}">Writing</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
    </nav>
  </div>
</header>

{{ content }}

<footer>
  <div class="wrap">
    <span>© {{ site.time | date: '%Y' }} Yuto Wong · Copenhagen</span>
    <span>
      <a href="mailto:thatyuto@outlook.com">Email</a>
      <a href="https://github.com/thatyuto" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/yutowong/" target="_blank" rel="noopener">LinkedIn</a>
    </span>
  </div>
</footer>

<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var els=document.querySelectorAll('.reveal');
  if(reduce||!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting)return;
      en.target.classList.add('in');
      en.target.querySelectorAll('.stat b').forEach(countUp);
      io.unobserve(en.target);
    });
  },{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  els.forEach(function(e){io.observe(e)});
  function countUp(b){
    var m=b.textContent.match(/^(~?)(\d+)(.*)$/); if(!m)return;
    var pre=m[1],end=+m[2],post=m[3],t0=null,d=900;
    function step(t){t0=t0||t;var k=Math.min((t-t0)/d,1);k=1-Math.pow(1-k,3);
      b.textContent=pre+Math.round(end*k)+post;if(k<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
